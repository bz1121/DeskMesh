name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  NUGET_PACKAGES: ${{ github.workspace }}\.nuget\packages

jobs:
  build-and-release:
    name: Build unsigned Windows release
    runs-on: windows-2025
    timeout-minutes: 60
    permissions:
      attestations: write
      contents: write
      id-token: write

    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      - name: Validate tag and product version
        id: version
        shell: pwsh
        run: |
          [xml]$props = Get-Content -LiteralPath .\Directory.Build.props -Raw
          $version = $props.SelectSingleNode('/Project/PropertyGroup/Version').InnerText.Trim()
          if ($version -notmatch '^[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?$') {
            throw "Directory.Build.props does not contain a releasable semantic version: '$version'"
          }
          $expectedTag = "v$version"
          if ($env:GITHUB_REF_NAME -cne $expectedTag) {
            throw "Tag '$env:GITHUB_REF_NAME' does not match product version '$expectedTag'."
          }
          if (-not (Select-String -LiteralPath .\CHANGELOG.md -SimpleMatch "[$version]" -Quiet)) {
            throw "CHANGELOG.md has no section for $version."
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Install frontend dependencies from lock file
        run: npm ci

      - name: Audit frontend dependencies
        run: npm audit --audit-level=high

      - name: Run checks and create portable package
        shell: pwsh
        run: .\scripts\package.ps1

      - name: Normalize release asset name and create checksum
        id: asset
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $source = Get-ChildItem -LiteralPath .\artifacts -File -Filter '*.zip' |
            Where-Object { $_.Name -like "*$version*win-x64*.zip" } |
            Sort-Object LastWriteTimeUtc -Descending |
            Select-Object -First 1
          if ($null -eq $source) { throw "Package script did not produce a versioned win-x64 ZIP." }

          $assetName = "DeskMesh-$version-win-x64.zip"
          $assetPath = Join-Path (Resolve-Path .\artifacts) $assetName
          if (-not [string]::Equals($source.FullName, $assetPath, [StringComparison]::OrdinalIgnoreCase)) {
            Copy-Item -LiteralPath $source.FullName -Destination $assetPath
          }
          $hash = (Get-FileHash -LiteralPath $assetPath -Algorithm SHA256).Hash.ToLowerInvariant()
          $checksumsPath = Join-Path (Resolve-Path .\artifacts) 'SHA256SUMS.txt'
          Set-Content -LiteralPath $checksumsPath -Encoding ascii -Value "$hash  $assetName"

          "path=$assetPath" >> $env:GITHUB_OUTPUT
          "name=$assetName" >> $env:GITHUB_OUTPUT
          "checksums=$checksumsPath" >> $env:GITHUB_OUTPUT
          "sha256=$hash" >> $env:GITHUB_OUTPUT

      - name: Attest release package provenance
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: ${{ steps.asset.outputs.path }}

      - name: Create unsigned Alpha GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $hash = '${{ steps.asset.outputs.sha256 }}'
          $notesPath = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          @"
          ## DeskMesh $version

          **This is an unsigned Alpha release that has not received an independent security audit.** Windows SmartScreen may report an unknown publisher. Verify `SHA256SUMS.txt` and the GitHub build provenance before running it.

          Remote desktop, system-audio forwarding, and the up-to-90-FPS mode are experimental. Use DeskMesh only on a trusted private Windows LAN, and never expose its peer port to the public Internet. See `CHANGELOG.md` for changes and known limitations, and `README.zh-CN.md` for Simplified Chinese documentation.

          SHA-256: $hash
          "@ | Set-Content -LiteralPath $notesPath -Encoding UTF8

          $arguments = @(
            'release', 'create', $env:GITHUB_REF_NAME,
            '${{ steps.asset.outputs.path }}',
            '${{ steps.asset.outputs.checksums }}',
            '--verify-tag',
            '--target', $env:GITHUB_SHA,
            '--title', "DeskMesh $version (unsigned Alpha)",
            '--notes-file', $notesPath
          )
          if ($version.Contains('-')) { $arguments += '--prerelease' }
          & gh @arguments
          if ($LASTEXITCODE -ne 0) { throw "GitHub Release creation failed." }
