name: CodeQL

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "23 18 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  NUGET_PACKAGES: ${{ github.workspace }}\.nuget\packages

jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    runs-on: windows-2025
    timeout-minutes: 40
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: csharp
            build-mode: manual
          - language: javascript-typescript
            build-mode: none

    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Initialize CodeQL
        uses: github/codeql-action/init@24c7eb380a2dc368f2d129e4c65e51d172983a1e # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Set up Node.js
        if: ${{ matrix.language == 'javascript-typescript' }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Build JavaScript and TypeScript
        if: ${{ matrix.language == 'javascript-typescript' }}
        run: |
          npm ci
          npm run build

      - name: Set up .NET
        if: ${{ matrix.language == 'csharp' }}
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      - name: Build C#
        if: ${{ matrix.language == 'csharp' }}
        run: |
          dotnet restore .\LanSwitch.slnx --locked-mode --configfile .\NuGet.Config
          dotnet build .\LanSwitch.slnx --no-restore --configuration Release

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@24c7eb380a2dc368f2d129e4c65e51d172983a1e # v4
        with:
          category: /language:${{ matrix.language }}
