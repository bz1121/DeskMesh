name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  NUGET_PACKAGES: ${{ github.workspace }}\.nuget\packages

jobs:
  verify:
    name: Windows verification
    runs-on: windows-2025
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      - name: Install frontend dependencies from lock file
        run: npm ci

      - name: Audit frontend dependencies
        run: npm audit --audit-level=high

      - name: Type-check frontend
        run: npm run typecheck

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend
        run: npm run build

      - name: Restore .NET dependencies
        run: dotnet restore .\LanSwitch.slnx --locked-mode --configfile .\NuGet.Config

      - name: Audit .NET dependencies
        run: dotnet list .\LanSwitch.slnx package --vulnerable --include-transitive --no-restore

      - name: Run .NET Release tests
        run: >-
          dotnet test .\LanSwitch.slnx
          --no-restore
          --configuration Release
          --logger trx
          --results-directory .\TestResults

      - name: Upload test results
        if: ${{ always() && hashFiles('TestResults/**/*.trx') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results-${{ github.run_id }}
          path: TestResults/**/*.trx
          if-no-files-found: error
          retention-days: 14
